<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16122b">
  <title>บ้านเกมปาร์ตี้ 🎲</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="hub-head">
      <div class="logo">🎲🎉</div>
      <h1>บ้านเกมปาร์ตี้</h1>
      <p class="muted">เลือกเกม สร้างห้อง แล้วให้เพื่อนเข้าห้องด้วยมือถือของตัวเอง</p>
    </div>

    <a class="game-card" id="game-spy" href="games/spy.html">
      <div class="icon">🕵️</div>
      <div>
        <h2>ใครคือสายลับ?</h2>
        <div class="muted small">ทุกคนรู้สถานที่ ยกเว้นสายลับ 1 คน ถามตอบกันให้เนียน แล้วจับตัวให้ได้!</div>
        <div class="tags"><span class="tag">👥 4 คนขึ้นไป</span><span class="tag">⏱️ 5–7 นาที</span><span class="tag">🗣️ ถาม-ตอบ</span></div>
      </div>
    </a>

    <div class="game-card soon">
      <div class="icon">❔</div>
      <div>
        <h2>เกมถัดไป…</h2>
        <div class="muted small">เร็ว ๆ นี้</div>
      </div>
    </div>

    <div class="footer">เล่นฟรี ไม่ต้องสมัคร · ทุกคนต้องต่ออินเทอร์เน็ต</div>
  </div>
  <script>
    // Keep test/debug params (e.g. a custom signalling server) when moving into a game
    if (location.search) document.querySelectorAll('a.game-card').forEach(a => a.href += location.search);
  </script>
</body>
</html>
